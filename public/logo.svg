<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Accent Dot Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="5" y="5" width="54" height="54" rx="13" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" fill="none" />

  <!-- Main AI Sparkle Symbol (Intelligence) -->
  <path d="M32 16 C32 23 26 29 19 29 C26 29 32 35 32 42 C32 35 38 29 45 29 C38 29 32 23 32 16 Z" 
        fill="url(#sparkleGrad)" 
        stroke="#FFFFFF" 
        stroke-width="0.75" />

  <!-- Top Right Mini Sparkle -->
  <path d="M44 15 C44 18 41 21 38 21 C41 21 44 24 44 27 C44 24 47 21 50 21 C47 21 44 18 44 15 Z" 
        fill="#FFFFFF" 
        opacity="0.9" />

  <!-- Bottom Left Mini Dot/Node (Network / Candidate Data) -->
  <circle cx="21" cy="43" r="3" fill="url(#accentGrad)" opacity="0.95" />
  <circle cx="43" cy="41" r="2" fill="#E0F2FE" opacity="0.75" />

  <!-- Subtle Connection Arc (AI Link) -->
  <path d="M24 43 Q 32 47 41 41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />
</svg>
